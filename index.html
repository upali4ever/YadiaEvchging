<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yadea Charging Tracker Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="text-center space-y-1">
      <h1 class="text-3xl font-extrabold text-green-400 flex items-center justify-center gap-2">
        ⚡ Yadea Charging Tracker
      </h1>
      <p class="text-xs text-gray-400">Charging Logs, Analytics & History</p>
    </div>

    <!-- Summary Cards -->
    <div class="grid grid-cols-2 md:grid-cols-3 gap-3">
      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center">
        <p class="text-xs text-gray-400">Total Distance</p>
        <p id="cardTotalKm" class="text-xl font-bold text-green-400">0 km</p>
      </div>
      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center">
        <p class="text-xs text-gray-400">Total Charges</p>
        <p id="cardTotalCharges" class="text-xl font-bold text-blue-400">0</p>
      </div>
      <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center col-span-2 md:col-span-1">
        <p class="text-xs text-gray-400">Avg. Km / Charge</p>
        <p id="cardAvgKm" class="text-xl font-bold text-yellow-400">0 km</p>
      </div>
    </div>

    <!-- Main Entry Form -->
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl space-y-4">
      <h2 class="text-lg font-bold text-gray-200 border-b border-gray-700 pb-2">➕ New Charging Entry</h2>
      
      <form id="chargeForm" class="space-y-4">
        
        <!-- Battery Visual & Inputs -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Start Battery %</label>
            <input type="number" id="startPct" min="0" max="100" required placeholder="eg: 20" 
                   class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl focus:border-green-500 text-white outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">End Battery %</label>
            <input type="number" id="endPct" min="0" max="100" required placeholder="eg: 100" 
                   class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl focus:border-green-500 text-white outline-none">
          </div>
        </div>

        <!-- Dynamic Battery Bar Visual -->
        <div>
          <div class="flex justify-between text-xs text-gray-400 mb-1">
            <span>Charged Range</span>
            <span id="chargePctText">0% Charged</span>
          </div>
          <div class="w-full bg-gray-900 rounded-full h-3 border border-gray-700 overflow-hidden">
            <div id="batteryBar" class="bg-green-500 h-3 rounded-full transition-all duration-300" style="width: 0%"></div>
          </div>
        </div>

        <!-- Odometer & Unit Cost -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Odometer Reading (km)</label>
            <input type="number" id="odometer" required placeholder="eg: 1250" 
                   class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl focus:border-green-500 text-white outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 mb-1">Est. Electricity Cost (Rs.) - Optional</label>
            <input type="number" id="cost" step="0.01" placeholder="eg: 150" 
                   class="w-full bg-gray-900 border border-gray-700 p-3 rounded-xl focus:border-green-500 text-white outline-none">
          </div>
        </div>

        <button type="submit" id="saveBtn" class="w-full bg-green-600 hover:bg-green-500 text-gray-900 font-bold py-3 rounded-xl shadow-lg transition duration-200">
          Data එක Save කරන්න
        </button>
      </form>
      <div id="statusMsg" class="text-center text-xs font-semibold hidden"></div>
    </div>

    <!-- History Table & Export -->
    <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-xl space-y-4">
      <div class="flex justify-between items-center border-b border-gray-700 pb-2">
        <h2 class="text-lg font-bold text-gray-200">📜 Charging History</h2>
        <button id="exportBtn" class="bg-gray-700 hover:bg-gray-600 text-xs text-gray-200 px-3 py-1.5 rounded-lg border border-gray-600">
          📥 Export CSV
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left text-xs text-gray-300">
          <thead class="bg-gray-900 text-gray-400 uppercase">
            <tr>
              <th class="p-3">Date</th>
              <th class="p-3">Battery %</th>
              <th class="p-3">Odometer</th>
              <th class="p-3">Distance</th>
              <th class="p-3">Cost</th>
              <th class="p-3 text-center">Action</th>
            </tr>
          </thead>
          <tbody id="historyTable" class="divide-y divide-gray-700">
            <tr><td colspan="6" class="p-4 text-center text-gray-500">Loading data...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script>
    // ⚠️ SUPABASE CREDENTIALS (ඔයාගේ Keys මෙතැනට දාන්න)
    const SUPABASE_URL = "https://jnjzzhbktkpnevspnnto.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impuanp6aGJrdGtwbmV2c3BubnRvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYxNzkxMzcsImV4cCI6MjEwMTc1NTEzN30.Snm4-YEQuRKDKwM35zg9vxGczCvlxIpiqjw1s8VZiqc";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let allLogs = [];

    // UI Battery Bar Animation
    const startInput = document.getElementById('startPct');
    const endInput = document.getElementById('endPct');
    const batteryBar = document.getElementById('batteryBar');
    const chargePctText = document.getElementById('chargePctText');

    function updateBatteryVisual() {
      const start = parseInt(startInput.value) || 0;
      const end = parseInt(endInput.value) || 0;
      const diff = Math.max(0, end - start);
      batteryBar.style.width = diff + '%';
      chargePctText.innerText = diff + '% Charged';
    }

    startInput.addEventListener('input', updateBatteryVisual);
    endInput.addEventListener('input', updateBatteryVisual);

    // Fetch Data from Supabase
    async function loadLogs() {
      const { data, error } = await supabaseClient
        .from('yadea_logs')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        console.error("Error loading logs:", error);
        return;
      }

      allLogs = data || [];
      renderHistoryAndCards();
    }

    // Render Table & Summary Cards
    function renderHistoryAndCards() {
      const tableBody = document.getElementById('historyTable');
      tableBody.innerHTML = '';

      if (allLogs.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-gray-500">තවම Data එකතු කර නැත.</td></tr>';
        return;
      }

      let totalKm = 0;
      let totalCharges = allLogs.length;

      allLogs.forEach((log, index) => {
        // Calculate distance driven since previous charge
        let distanceDriven = "-";
        if (index < allLogs.length - 1) {
          const prevOdometer = allLogs[index + 1].odometer;
          const diff = log.odometer - prevOdometer;
          if (diff > 0) {
            distanceDriven = diff + " km";
            totalKm += diff;
          }
        }

        const dateStr = new Date(log.created_at).toLocaleDateString('si-LK', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

        const row = `
          <tr class="hover:bg-gray-750 border-b border-gray-700">
            <td class="p-3">${dateStr}</td>
            <td class="p-3"><span class="text-green-400 font-semibold">${log.start_pct}% ➔ ${log.end_pct}%</span></td>
            <td class="p-3">${log.odometer} km</td>
            <td class="p-3 font-bold text-yellow-400">${distanceDriven}</td>
            <td class="p-3">${log.cost ? 'Rs. ' + log.cost : '-'}</td>
            <td class="p-3 text-center">
              <button onclick="deleteLog(${log.id})" class="bg-red-600 hover:bg-red-700 text-white font-bold text-xs px-2 py-1 rounded transition">
                🗑️ Delete
              </button>
            </td>
          </tr>
        `;
        tableBody.innerHTML += row;
      });

      // Update Summary Cards
      document.getElementById('cardTotalKm').innerText = totalKm + " km";
      document.getElementById('cardTotalCharges').innerText = totalCharges;
      const avg = totalCharges > 1 ? (totalKm / (totalCharges - 1)).toFixed(1) : 0;
      document.getElementById('cardAvgKm').innerText = avg + " km";
    }

    // Delete Function
    async function deleteLog(id) {
      if (confirm("මෙම Entry එක ඉවත් කිරීමට විශ්වාසද?")) {
        const { error } = await supabaseClient
          .from('yadea_logs')
          .delete()
          .eq('id', id);

        if (error) {
          alert("❌ Delete කිරීමේ දෝෂයක්: " + error.message);
        } else {
          loadLogs(); // Refresh list
        }
      }
    }

    // Form Submit Function
    document.getElementById('chargeForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const saveBtn = document.getElementById('saveBtn');
      const statusMsg = document.getElementById('statusMsg');

      saveBtn.innerText = "Save වෙමින් පවතී...";
      saveBtn.disabled = true;

      const payload = {
        start_pct: parseInt(startInput.value),
        end_pct: parseInt(endInput.value),
        odometer: parseInt(document.getElementById('odometer').value),
        cost: parseFloat(document.getElementById('cost').value) || null
      };

      const { error } = await supabaseClient.from('yadea_logs').insert([payload]);

      if (error) {
        statusMsg.innerText = "❌ Error: " + error.message;
        statusMsg.className = "text-center text-xs font-semibold text-red-500 mt-2";
      } else {
        statusMsg.innerText = "✅ Data එක සාර්ථකව Save වුණා!";
        statusMsg.className = "text-center text-xs font-semibold text-green-400 mt-2";
        document.getElementById('chargeForm').reset();
        updateBatteryVisual();
        loadLogs(); // Reload list
      }

      statusMsg.classList.remove('hidden');
      saveBtn.innerText = "Data එක Save කරන්න";
      saveBtn.disabled = false;
    });

    // Export to CSV Function
    document.getElementById('exportBtn').addEventListener('click', () => {
      if (allLogs.length === 0) return alert("Export කිරීමට Data නැත!");
      
      let csvContent = "data:text/csv;charset=utf-8,Date,Start %,End %,Odometer,Cost\n";
      allLogs.forEach(row => {
        csvContent += `${row.created_at},${row.start_pct},${row.end_pct},${row.odometer},${row.cost || ''}\n`;
      });

      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", "yadea_charging_logs.csv");
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    });

    // Initial Load
    loadLogs();
  </script>
</body>
</html>
